<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe vs Computer</title>
  <style>
    :root {
      --bg: #111827;
      --panel: #1f2937;
      --panel-alt: #0f172a;
      --cell: #374151;
      --cell-hover: #4b5563;
      --text: #e5e7eb;
      --muted: #cbd5e1;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --danger: #f87171;
      --shadow: rgba(0, 0, 0, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .app {
      width: min(92vw, 520px);
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 24px;
      box-shadow: 0 18px 40px var(--shadow);
      padding: 22px 18px 18px;
    }

    h1 {
      margin: 0 0 18px;
      text-align: center;
      font-size: clamp(1.8rem, 3vw, 2.5rem);
      letter-spacing: 0.04em;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .score {
      background: var(--panel);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 16px;
      text-align: center;
      padding: 10px 8px;
    }

    .score-label {
      display: block;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .score-value {
      display: block;
      font-size: clamp(1.2rem, 2vw, 1.7rem);
      font-weight: 700;
    }

    .status {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 12px 10px;
      border-radius: 14px;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.2);
      color: var(--text);
      font-weight: 600;
      margin-bottom: 18px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .cell {
      background: linear-gradient(180deg, var(--cell), #283548);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 18px;
      color: var(--text);
      font-size: clamp(2.4rem, 7vw, 4rem);
      font-weight: 700;
      aspect-ratio: 1 / 1;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .cell:hover:not(:disabled) {
      background: linear-gradient(180deg, var(--cell-hover), #374151);
      border-color: rgba(56, 189, 248, 0.45);
      transform: translateY(-1px);
    }

    .cell:disabled {
      cursor: default;
      opacity: 1;
    }

    .cell.x {
      color: var(--accent);
    }

    .cell.o {
      color: var(--accent-2);
    }

    .controls {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      border: none;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: filter 0.15s ease, transform 0.15s ease;
      color: white;
    }

    .btn:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-primary {
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
    }

    .btn-secondary {
      background: linear-gradient(135deg, #ef4444, #dc2626);
    }

    @media (max-width: 480px) {
      .app {
        padding: 18px 14px 14px;
      }

      .scoreboard {
        gap: 8px;
      }

      .score {
        padding: 10px 6px;
      }

      .controls {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Tic-Tac-Toe</h1>

    <div class="scoreboard" aria-label="Scoreboard">
      <div class="score">
        <span class="score-label">You</span>
        <span class="score-value" id="player-score">0</span>
      </div>
      <div class="score">
        <span class="score-label">Computer</span>
        <span class="score-value" id="computer-score">0</span>
      </div>
      <div class="score">
        <span class="score-label">Draws</span>
        <span class="score-value" id="draw-score">0</span>
      </div>
    </div>

    <div id="status" class="status" aria-live="polite">Your turn — you are X</div>

    <div class="board" id="board" aria-label="Tic-Tac-Toe board">
      <button class="cell" data-index="0" aria-label="Cell 1"></button>
      <button class="cell" data-index="1" aria-label="Cell 2"></button>
      <button class="cell" data-index="2" aria-label="Cell 3"></button>
      <button class="cell" data-index="3" aria-label="Cell 4"></button>
      <button class="cell" data-index="4" aria-label="Cell 5"></button>
      <button class="cell" data-index="5" aria-label="Cell 6"></button>
      <button class="cell" data-index="6" aria-label="Cell 7"></button>
      <button class="cell" data-index="7" aria-label="Cell 8"></button>
      <button class="cell" data-index="8" aria-label="Cell 9"></button>
    </div>

    <div class="controls">
      <button id="new-round" class="btn btn-primary">New Round</button>
      <button id="reset-scores" class="btn btn-secondary">Reset Scores</button>
    </div>
  </main>

  <script>
    const winningCombos = [
      [0, 1, 2],
      [3, 4, 5],
      [6, 7, 8],
      [0, 3, 6],
      [1, 4, 7],
      [2, 5, 8],
      [0, 4, 8],
      [2, 4, 6]
    ];

    let board = Array(9).fill("");
    let gameOver = false;
    let currentPlayer = "X";
    let scores = {
      player: 0,
      computer: 0,
      draw: 0
    };

    const statusEl = document.getElementById("status");
    const cells = [...document.querySelectorAll(".cell")];
    const playerScoreEl = document.getElementById("player-score");
    const computerScoreEl = document.getElementById("computer-score");
    const drawScoreEl = document.getElementById("draw-score");
    const newRoundBtn = document.getElementById("new-round");
    const resetScoresBtn = document.getElementById("reset-scores");

    function updateScoreboard() {
      playerScoreEl.textContent = scores.player;
      computerScoreEl.textContent = scores.computer;
      drawScoreEl.textContent = scores.draw;
    }

    function availableMoves(b) {
      return b
        .map((value, index) => (value === "" ? index : null))
        .filter((value) => value !== null);
    }

    function getWinner(b) {
      for (const combo of winningCombos) {
        const [a, bIndex, c] = combo;
        if (b[a] && b[a] === b[bIndex] && b[a] === b[c]) {
          return { winner: b[a], combo };
        }
      }
      return null;
    }

    function isBoardFull(b) {
      return b.every((cell) => cell !== "");
    }

    function renderBoard() {
      cells.forEach((cell) => {
        const index = Number(cell.dataset.index);
        const value = board[index];

        cell.textContent = value;
        cell.classList.remove("x", "o");

        if (value === "X") {
          cell.classList.add("x");
        } else if (value === "O") {
          cell.classList.add("o");
        }

        const isDisabled =
          value !== "" || gameOver || currentPlayer !== "X";

        cell.disabled = isDisabled;
      });
    }

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function finishRound(result) {
      gameOver = true;
      renderBoard();

      if (result && result.winner === "X") {
        scores.player += 1;
        setStatus("You win! 🎉");
      } else if (result && result.winner === "O") {
        scores.computer += 1;
        setStatus("Computer wins. Better luck next time!");
      } else {
        scores.draw += 1;
        setStatus("It's a draw!");
      }

      updateScoreboard();
    }

    function startNewRound() {
      board = Array(9).fill("");
      gameOver = false;
      currentPlayer = "X";
      setStatus("Your turn — you are X");
      renderBoard();
    }

    function makeComputerMove() {
      if (gameOver || currentPlayer !== "O") return;

      const bestMove = getBestMove(board);
      if (bestMove === null) return;

      board[bestMove] = "O";
      const result = getWinner(board);

      if (result) {
        finishRound(result);
        return;
      }

      if (isBoardFull(board)) {
        finishRound(null);
        return;
      }

      currentPlayer = "X";
      renderBoard();
      setStatus("Your turn — you are X");
    }

    function minimax(position, depth, isMaximizing) {
      const winner = getWinner(position);

      if (winner && winner.winner === "O") return 10 - depth;
      if (winner && winner.winner === "X") return depth - 10;
      if (isBoardFull(position)) return 0;

      if (isMaximizing) {
        let bestScore = -Infinity;

        for (const move of availableMoves(position)) {
          position[move] = "O";
          const score = minimax(position, depth + 1, false);
          position[move] = "";
          bestScore = Math.max(bestScore, score);
        }

        return bestScore;
      }

      let bestScore = Infinity;

      for (const move of availableMoves(position)) {
        position[move] = "X";
        const score = minimax(position, depth + 1, true);
        position[move] = "";
        bestScore = Math.min(bestScore, score);
      }

      return bestScore;
    }

    function getBestMove(position) {
      let bestScore = -Infinity;
      let bestMove = null;

      const moves = availableMoves(position);

      for (const move of moves) {
        position[move] = "O";
        const score = minimax(position, 0, false);
        position[move] = "";

        if (score > bestScore) {
          bestScore = score;
          bestMove = move;
        }
      }

      return bestMove;
    }

    cells.forEach((cell) => {
      cell.addEventListener("click", () => {
        if (gameOver || currentPlayer !== "X") return;

        const index = Number(cell.dataset.index);

        if (board[index] !== "") return;

        board[index] = "X";

        const result = getWinner(board);

        if (result) {
          finishRound(result);
          return;
        }

        if (isBoardFull(board)) {
          finishRound(null);
          return;
        }

        currentPlayer = "O";
        renderBoard();
        setStatus("Computer is thinking...");

        window.setTimeout(() => {
          makeComputerMove();
        }, 500);
      });
    });

    newRoundBtn.addEventListener("click", startNewRound);
    resetScoresBtn.addEventListener("click", () => {
      scores = { player: 0, computer: 0, draw: 0 };
      updateScoreboard();
      startNewRound();
    });

    updateScoreboard();
    renderBoard();
  </script>
</body>
</html>
